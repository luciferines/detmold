<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Made by Bobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --gold: #f59e0b;
      --copper: #ea580c;
      --blue: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    /* Fernbedienungs-Fokus (D-Pad) */
    :focus {
      outline: 3px solid var(--gold) !important;
      outline-offset: 2px;
      transform: scale(1.01);
      transition: all 0.15s ease;
    }

    /* Header Bar */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .badge-bobby {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 6px 14px;
      border-radius: 8px;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.1);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* Center Info Widgets */
    .center-widgets {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
    }

    .clock-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .date-display {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* View Controls */
    .controls {
      display: flex;
      gap: 6px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .btn:hover, .btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-body {
      padding: 12px;
      flex: 1;
    }

    /* Spans */
    .col-webcam { grid-column: span 7; }
    .col-scrap { grid-column: span 5; }
    .col-tv { grid-column: span 6; }
    .col-events { grid-column: span 6; }
    .col-weather { grid-column: span 6; }
    .col-radar { grid-column: span 6; }

    /* Webcam */
    .webcam-container {
      position: relative;
      width: 100%;
      height: 380px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .webcam-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .webcam-status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Schrottpreise Kompakt-Tabelle */
    .scrap-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .scrap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px 10px;
      border-radius: 6px;
